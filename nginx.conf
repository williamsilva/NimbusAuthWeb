server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # no-store: sem isso o Chrome pode prerenderizar a raiz por predição do omnibox (ativado ao
  # digitar a URL) - como o login faz uma navegação cross-origin (window.location.assign pro
  # backend), isso é incompatível com prerender e quebra o fluxo OAuth2/PKCE (mesmo problema
  # corrigido em produção via public/_headers - aqui é o equivalente pro nginx do Docker/dev).
  location / {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri $uri/ /index.html;
  }
}
