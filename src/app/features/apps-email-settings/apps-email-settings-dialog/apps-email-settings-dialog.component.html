<p-dialog
  [modal]="true"
  appendTo="body"
  [closable]="true"
  [draggable]="false"
  [resizable]="false"
  [visible]="visible()"
  (visibleChange)="!$event && close()"
  [style]="{ width: '720px', maxWidth: '95vw' }"
  [header]="'E-mail de ' + (appName() ?? appKey())"
>
  @if (loading()) {
    <p>Carregando…</p>
  } @else {
    <form [formGroup]="form" class="settings-form">
      <p-fieldset legend="Remetente">
        <div class="settings-grid">
          <div class="field">
            <label for="apps-email-impl">Modo de envio</label>
            <p-select
              inputId="apps-email-impl"
              formControlName="impl"
              [options]="implOptions()"
              optionLabel="label"
              optionValue="value"
              class="w-full"
            />
          </div>
          <div class="field">
            <label for="apps-email-fromName">Nome do remetente</label>
            <input id="apps-email-fromName" pInputText type="text" formControlName="fromName" class="w-full" />
          </div>
          <div class="field">
            <label for="apps-email-fromEmail">E-mail do remetente</label>
            <input id="apps-email-fromEmail" pInputText type="email" formControlName="fromEmail" class="w-full" />
          </div>
        </div>
      </p-fieldset>

      <p-fieldset legend="Brevo (API)">
        <div class="settings-grid">
          <div class="field">
            <label for="apps-email-brevoApiKey">Chave de API</label>
            <p-password
              inputId="apps-email-brevoApiKey"
              formControlName="brevoApiKey"
              [feedback]="false"
              [toggleMask]="true"
              styleClass="w-full"
              inputStyleClass="w-full"
              placeholder="Deixe em branco pra manter a atual"
            />
          </div>
          <div class="field">
            <label for="apps-email-brevoBaseUrl">URL base</label>
            <input id="apps-email-brevoBaseUrl" pInputText type="text" formControlName="brevoBaseUrl" class="w-full" placeholder="https://api.brevo.com/v3" />
          </div>
        </div>
      </p-fieldset>

      <p-fieldset legend="SMTP">
        <div class="settings-grid">
          <div class="field">
            <label for="apps-email-smtpHost">Host</label>
            <input id="apps-email-smtpHost" pInputText type="text" formControlName="smtpHost" class="w-full" />
          </div>
          <div class="field">
            <label for="apps-email-smtpPort">Porta</label>
            <p-inputNumber inputId="apps-email-smtpPort" formControlName="smtpPort" [useGrouping]="false" class="w-full" />
          </div>
          <div class="field">
            <label for="apps-email-smtpUsername">Usuário</label>
            <input id="apps-email-smtpUsername" pInputText type="text" formControlName="smtpUsername" class="w-full" />
          </div>
          <div class="field">
            <label for="apps-email-smtpPassword">Senha</label>
            <p-password
              inputId="apps-email-smtpPassword"
              formControlName="smtpPassword"
              [feedback]="false"
              [toggleMask]="true"
              styleClass="w-full"
              inputStyleClass="w-full"
              placeholder="Deixe em branco pra manter a atual"
            />
          </div>
        </div>

        <div class="settings-grid mt-3">
          <div class="field-checkbox">
            <p-checkbox formControlName="smtpAuth" inputId="apps-email-smtpAuth" [binary]="true" /><label for="apps-email-smtpAuth" class="ml-2">Autenticação</label>
          </div>
          <div class="field-checkbox">
            <p-checkbox formControlName="smtpStarttls" inputId="apps-email-smtpStarttls" [binary]="true" /><label for="apps-email-smtpStarttls" class="ml-2">STARTTLS</label>
          </div>
          <div class="field-checkbox">
            <p-checkbox formControlName="smtpSsl" inputId="apps-email-smtpSsl" [binary]="true" /><label for="apps-email-smtpSsl" class="ml-2">SSL</label>
          </div>
        </div>
      </p-fieldset>
    </form>
  }

  <ng-template pTemplate="footer">
    <button pButton type="button" label="Fechar" class="p-button-text" (click)="close()"></button>
    <button pButton type="button" icon="pi pi-save" label="Salvar" [loading]="saving()" [disabled]="loading()" (click)="save()"></button>
  </ng-template>
</p-dialog>
