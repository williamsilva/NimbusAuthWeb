<p-dialog
  [modal]="true"
  appendTo="body"
  [closable]="true"
  [draggable]="false"
  [resizable]="false"
  [visible]="visible()"
  (visibleChange)="!$event && close()"
  [style]="{ width: '720px', maxWidth: '95vw' }"
  [header]="'appsEmailSettings.dialog.titlePrefix' | translate: { name: appName() ?? appKey() }"
>
  @if (loading()) {
    <p>{{ 'emailSettings.loading' | translate }}</p>
  } @else {
    <form [formGroup]="form" class="settings-form">
      <p-fieldset [legend]="'emailSettings.fieldset.sender' | translate">
        <div class="settings-grid">
          <div class="field">
            <p-floatLabel variant="on" class="w-full">
              <p-select
                inputId="apps-email-impl"
                formControlName="impl"
                [options]="implOptions()"
                optionLabel="label"
                optionValue="value"
                class="w-full"
              />
              <app-error-msg forId="apps-email-impl" [label]="'emailSettings.fields.impl' | translate" [control]="form.controls.impl" />
            </p-floatLabel>
          </div>
          <div class="field">
            <p-floatLabel variant="on" class="w-full">
              <input id="apps-email-fromName" pInputText type="text" formControlName="fromName" class="w-full" />
              <app-error-msg forId="apps-email-fromName" [label]="'emailSettings.fields.fromName' | translate" [control]="form.controls.fromName" />
            </p-floatLabel>
          </div>
          <div class="field">
            <p-floatLabel variant="on" class="w-full">
              <input id="apps-email-fromEmail" pInputText type="email" formControlName="fromEmail" class="w-full" />
              <app-error-msg forId="apps-email-fromEmail" [label]="'emailSettings.fields.fromEmail' | translate" [control]="form.controls.fromEmail" />
            </p-floatLabel>
          </div>
        </div>
      </p-fieldset>

      <p-fieldset [legend]="'emailSettings.fieldset.brevo' | translate">
        <div class="settings-grid">
          <div class="field">
            <p-floatLabel variant="on" class="w-full">
              <p-password
                inputId="apps-email-brevoApiKey"
                formControlName="brevoApiKey"
                [feedback]="false"
                [toggleMask]="true"
                styleClass="w-full"
                inputStyleClass="w-full"
                [placeholder]="'emailSettings.placeholders.secretKeepCurrent' | translate"
              />
              <app-error-msg forId="apps-email-brevoApiKey" [label]="'emailSettings.fields.brevoApiKey' | translate" [required]="false" [control]="form.controls.brevoApiKey" />
            </p-floatLabel>
          </div>
          <div class="field">
            <p-floatLabel variant="on" class="w-full">
              <input id="apps-email-brevoBaseUrl" pInputText type="text" formControlName="brevoBaseUrl" class="w-full" [placeholder]="'emailSettings.placeholders.brevoBaseUrl' | translate" />
              <app-error-msg forId="apps-email-brevoBaseUrl" [label]="'emailSettings.fields.brevoBaseUrl' | translate" [required]="false" [control]="form.controls.brevoBaseUrl" />
            </p-floatLabel>
          </div>
        </div>
      </p-fieldset>

      <p-fieldset [legend]="'emailSettings.fieldset.smtp' | translate">
        <div class="settings-grid">
          <div class="field">
            <p-floatLabel variant="on" class="w-full">
              <input id="apps-email-smtpHost" pInputText type="text" formControlName="smtpHost" class="w-full" />
              <app-error-msg forId="apps-email-smtpHost" [label]="'emailSettings.fields.smtpHost' | translate" [required]="false" [control]="form.controls.smtpHost" />
            </p-floatLabel>
          </div>
          <div class="field">
            <p-floatLabel variant="on" class="w-full">
              <p-inputNumber inputId="apps-email-smtpPort" formControlName="smtpPort" [useGrouping]="false" class="w-full" />
              <app-error-msg forId="apps-email-smtpPort" [label]="'emailSettings.fields.smtpPort' | translate" [required]="false" [control]="form.controls.smtpPort" />
            </p-floatLabel>
          </div>
          <div class="field">
            <p-floatLabel variant="on" class="w-full">
              <input id="apps-email-smtpUsername" pInputText type="text" formControlName="smtpUsername" class="w-full" />
              <app-error-msg forId="apps-email-smtpUsername" [label]="'emailSettings.fields.smtpUsername' | translate" [required]="false" [control]="form.controls.smtpUsername" />
            </p-floatLabel>
          </div>
          <div class="field">
            <p-floatLabel variant="on" class="w-full">
              <p-password
                inputId="apps-email-smtpPassword"
                formControlName="smtpPassword"
                [feedback]="false"
                [toggleMask]="true"
                styleClass="w-full"
                inputStyleClass="w-full"
                [placeholder]="'emailSettings.placeholders.secretKeepCurrent' | translate"
              />
              <app-error-msg forId="apps-email-smtpPassword" [label]="'emailSettings.fields.smtpPassword' | translate" [required]="false" [control]="form.controls.smtpPassword" />
            </p-floatLabel>
          </div>
        </div>

        <div class="settings-grid mt-3">
          <div class="field-checkbox">
            <p-checkbox formControlName="smtpAuth" inputId="apps-email-smtpAuth" [binary]="true" /><label for="apps-email-smtpAuth" class="ml-2">{{ 'emailSettings.fields.smtpAuth' | translate }}</label>
          </div>
          <div class="field-checkbox">
            <p-checkbox formControlName="smtpStarttls" inputId="apps-email-smtpStarttls" [binary]="true" /><label for="apps-email-smtpStarttls" class="ml-2">{{ 'emailSettings.fields.smtpStarttls' | translate }}</label>
          </div>
          <div class="field-checkbox">
            <p-checkbox formControlName="smtpSsl" inputId="apps-email-smtpSsl" [binary]="true" /><label for="apps-email-smtpSsl" class="ml-2">{{ 'emailSettings.fields.smtpSsl' | translate }}</label>
          </div>
        </div>
      </p-fieldset>
    </form>
  }

  <ng-template pTemplate="footer">
    <button pButton type="button" [label]="'appsEmailSettings.dialog.close' | translate" class="p-button-text" (click)="close()"></button>
    <button pButton type="button" icon="pi pi-save" [label]="'appsEmailSettings.dialog.save' | translate" [loading]="saving()" [disabled]="loading()" (click)="save()"></button>
  </ng-template>
</p-dialog>
