<app-page-header
  [title]="'appsEmailSettings.list.title' | translate"
  [subtitle]="'appsEmailSettings.list.subtitle' | translate"
></app-page-header>

<p-table [value]="apps()" [loading]="loading()" dataKey="id" class="app-admin-table">
  <ng-template pTemplate="header">
    <tr>
      <th><div class="th-flex"><span class="th-label">{{ 'appsEmailSettings.list.columns.name' | translate }}</span></div></th>
      <th><div class="th-flex"><span class="th-label">{{ 'appsEmailSettings.list.columns.appKey' | translate }}</span></div></th>
      <th class="text-center" style="width: 8rem"><div class="th-flex justify-content-center"><span class="th-label">{{ 'appsEmailSettings.list.columns.actions' | translate }}</span></div></th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-row>
    <tr>
      <td>{{ row.name }}</td>
      <td>{{ row.appKey }}</td>
      <td class="text-center">
        <div class="table-actions">
          <button
            pButton
            type="button"
            icon="pi pi-pencil"
            class="p-button-text p-button-sm"
            [pTooltip]="'appsEmailSettings.list.editTooltip' | translate"
            [attr.aria-label]="'appsEmailSettings.list.editTooltip' | translate"
            (click)="edit(row)"
          ></button>
        </div>
      </td>
    </tr>
  </ng-template>

  <ng-template pTemplate="emptymessage">
    <tr>
      <td colspan="3" class="text-center py-5 opacity-70">{{ 'appsEmailSettings.list.empty' | translate }}</td>
    </tr>
  </ng-template>
</p-table>

<app-apps-email-settings-dialog
  [visible]="dialogVisible()"
  [appKey]="editingApp()?.appKey ?? null"
  [appName]="editingApp()?.name ?? null"
  (visibleChange)="onDialogVisibleChange($event)"
/>
