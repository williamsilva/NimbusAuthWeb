<p-dialog
  [modal]="true"
  appendTo="body"
  [closable]="false"
  [draggable]="false"
  [resizable]="false"
  [visible]="!!secret()"
  [style]="{ width: '560px', maxWidth: '95vw' }"
  header="Client secret gerado"
>
  @if (secret(); as s) {
    <p class="mb-3">
      Copie agora - <strong>este valor não será mostrado de novo</strong>. Cole nas variáveis de
      ambiente do app <strong>{{ s.app.name }}</strong> (client-id: <code>{{ s.app.clientId }}</code>).
    </p>

    <div class="flex gap-2">
      <input pInputText type="text" readonly [value]="s.clientSecret" class="w-full font-mono" />
      <button pButton type="button" icon="pi pi-copy" (click)="copy()" class="p-button-outlined"></button>
    </div>
  }

  <ng-template pTemplate="footer">
    <button pButton type="button" (click)="close()" icon="pi pi-check" label="Já copiei, fechar"></button>
  </ng-template>
</p-dialog>
