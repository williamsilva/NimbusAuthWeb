<p-dialog
  [modal]="true"
  appendTo="body"
  [closable]="false"
  [draggable]="false"
  [resizable]="false"
  [visible]="visible()"
  [style]="{ width: '640px', maxWidth: '95vw' }"
  [header]="group() ? ('groups.manage.titleWithName' | translate: { name: group()!.name }) : ('groups.manage.title' | translate)"
>
  <p-tabs value="0">
    <p-tablist>
      <p-tab value="0">{{ 'groups.manage.tabs.permissions' | translate }}</p-tab>
      <p-tab value="1">{{ 'groups.manage.tabs.users' | translate }}</p-tab>
    </p-tablist>
    <p-tabpanels>
      <p-tabpanel value="0">
        <p-multiSelect
          [options]="permissionOptions()"
          [(ngModel)]="selectedPermissionIds"
          optionLabel="description"
          optionValue="id"
          display="chip"
          [filter]="true"
          appendTo="body"
          [placeholder]="'groups.manage.permissionsPlaceholder' | translate"
          class="w-full"
        />
        <div class="flex justify-content-end mt-3">
          <button
            pButton
            type="button"
            icon="pi pi-save"
            [label]="'groups.manage.savePermissionsButton' | translate"
            class="p-button-sm"
            [loading]="savingPermissions()"
            (click)="savePermissions()"
          ></button>
        </div>
      </p-tabpanel>

      <p-tabpanel value="1">
        <p-multiSelect
          [options]="userOptions()"
          [(ngModel)]="selectedUserIds"
          optionLabel="name"
          optionValue="id"
          display="chip"
          [filter]="true"
          appendTo="body"
          [placeholder]="'groups.manage.usersPlaceholder' | translate"
          class="w-full"
        />
        <small class="block mt-2 text-color-secondary">
          {{ 'groups.manage.usersRemoveHint' | translate }}
        </small>
        <div class="flex justify-content-end mt-3">
          <button
            pButton
            type="button"
            icon="pi pi-save"
            [label]="'groups.manage.saveUsersButton' | translate"
            class="p-button-sm"
            [loading]="savingUsers()"
            (click)="saveUsers()"
          ></button>
        </div>
      </p-tabpanel>
    </p-tabpanels>
  </p-tabs>

  <ng-template pTemplate="footer">
    <button pButton type="button" (click)="close()" icon="pi pi-times" class="p-button-text p-button-sm" [label]="'groups.manage.close' | translate"></button>
  </ng-template>
</p-dialog>
