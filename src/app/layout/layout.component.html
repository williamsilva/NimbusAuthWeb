<app-topbar class="topbar-wrapper" [attr.data-mode]="layoutMode()"></app-topbar>

<div
  class="shell"
  [class.sidebar-collapsed]="!sidebarVisible()"
  [attr.data-mode]="layoutMode()"
  >
  @if (sidebarVisible() && layoutMode() !== 'horizontal') {
    <app-sidebar class="sidebar-host"></app-sidebar>
  }

  <main class="content">
    <div class="content-inner cs-glass">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>

<app-footer
  class="footer-fixed"
  [class.sidebar-collapsed]="!sidebarVisible() || layoutMode() === 'horizontal' || layoutMode() === 'drawer'"
  [attr.data-mode]="layoutMode()"
  ></app-footer>
